services:
  - type: web
    name: restaurant-chatbot-demo
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_MODEL
        value: gpt-5-nano
      - key: OPENAI_API_KEY
        sync: false
